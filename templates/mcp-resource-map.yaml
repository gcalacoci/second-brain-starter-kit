# MCP Resource Map for Second Brain KB

resources:
  - uri: "second-brain://schema"
    path: "SCHEMA.md"
    mimeType: "text/markdown"

  - uri: "second-brain://wiki/index"
    path: "wiki/index.md"
    mimeType: "text/markdown"

  - uri: "second-brain://wiki/log"
    path: "wiki/log.md"
    mimeType: "text/markdown"

  - uri: "second-brain://wiki/processed"
    path: "wiki/processed.md"
    mimeType: "text/markdown"

  - uri: "second-brain://config"
    path: ".overmind/config.yaml"
    mimeType: "text/yaml"
